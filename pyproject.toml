[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seisforge"
version = "0.1.0"
description = "A Python toolkit for seismic processing and analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mengjie Zheng", email = "mengjie.zheng@utoronto.ca"}]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "obspy"
]

[project.scripts]
hkseq = "seisforge.rf.hkSeq:main"