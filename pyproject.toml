[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seisforge"
version = "0.2.0"
description = "A Python toolkit for seismic processing and analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mengjie Zheng", email = "mengjie.zheng96@outlook.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "obspy>=1.4",
    "xarray>=2023.1",
    "h5netcdf>=1.1",
    "h5py>=3.8",
    "joblib>=1.2",
    "pyproj>=3.5",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "disba>=0.6",
    "numba>=0.57",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# disba is a core dependency; inv and hvsr stay as no-op extras so existing
# `pip install seisforge[inv]` commands keep working.
inv = []
hvsr = []
hvsr-fortran = [
    "meson>=1.3",
    "ninja",
]
gmt = [
    "pygmt",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=1.0,<2",
    "pymdown-extensions",
]

[project.scripts]
seisforge = "seisforge.cli.main:main"
rfqc = "seisforge.rf.qc:main"
hkseq = "seisforge.rf.hk:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seisforge.hvsr" = [
    "_fortran_src/*.f90",
    "_fortran_src/.f2py_f2cmap",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No pythonpath: tests import the installed package (pip install -e ".[dev]"),
# so packaging gaps show up as test failures.

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit so newer ruff releases (whose default rule set grew in 0.16) do not
# silently change what CI enforces.
select = ["E4", "E7", "E9", "F"]
