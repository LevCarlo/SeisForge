IO:
  # Station-level RF working directory.
  ROOT: /path/to/RFs_SEISPY/NET.STA
  HighFreq_RF: Gauss_5.0_CLEAN
  LowFreq_RF: Gauss_2.5_CLEAN
  # Output directory under ROOT; must not overlap ROOT itself or the RF inputs.
  SAVE: hkSeq
  FIGURE: figures
  LOG: logs
  # Existing outputs of the requested stage(s) stop the run unless true
  # (or --overwrite). Other stages' outputs are never removed.
  OVERWRITE: false

Meta:
  station: STA
  network: NET

Model:
  Sediment:
    H:
      min: 0.0
      max: 5.0
      delta: 0.05
    k:
      min: 1.50
      max: 3.00
      delta: 0.01
    Vp: null
    Vs: 2.5
    weight: [0.5, 0.2, 0.3]
    # Grid points with a shorter Ps delay lie on the direct-P pulse and are not
    # picked. Assumed: the Gaussian a = 5 pulse exp(-a^2 t^2) falls to 10 % at
    # sqrt(ln 10) / a = 0.30 s.
    min_ps_delay_s: 0.3
    # Assumed: a thinner sediment estimate is ignored and the crust is
    # stacked as one layer.
    two_layer_min_thickness_km: 0.4
  Crust:
    H:
      min: 30.0
      max: 50.0
      delta: 0.2
    k:
      min: 1.50
      max: 2.00
      delta: 0.01
    Vp: 6.3
    Vs: null
    weight: [0.5, 0.2, 0.3]
    # Assumed: a = 2.5 pulse falls to 10 % at 0.61 s (no effect for H >= 30 km).
    min_ps_delay_s: 0.6

QC:
  HighFreq:
    mahalanobis_dist_threshold: 1.0
  LowFreq:
    mahalanobis_dist_threshold: 1.0
