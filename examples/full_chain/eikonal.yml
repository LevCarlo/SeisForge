# Step 3: Eikonal tomography. Reference: examples/reference_configs/eikonal.yml
input:
  dataset: output/measurements.nc
  periods_s: [4, 5, 6, 7, 8]           # change this: the periods of collect-dispersion
grid:                                  # change this: box around your stations
  min_longitude_deg: 109.8
  max_longitude_deg: 111.8
  min_latitude_deg: 29.8
  max_latitude_deg: 31.65
  longitude_step_deg: 0.05
  latitude_step_deg: 0.05
stacking:
  min_raw_measurements_per_cell: 10    # change this: below the number of stations
output:
  directory: output/eikonal
compute:
  workers: 4
