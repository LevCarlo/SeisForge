# Rotate the nine ZNE cross-correlations of one station pair to ZRT.
# Every key and its default: examples/reference_configs/ccf_rotate.yml
io:
  # change this: the ZNE files of the pair; {component} = ZZ, ZN, ZE, NZ, ... EE
  input_template: data/ccf_zne/XX.A/XX.A_XX.B/XX.A_XX.B_{component}.SAC
  # where the ZRT files go; {component} = ZZ, ZR, ZT, RZ, ... TT
  output_template: output/XX.A/XX.A_XX.B/XX.A_XX.B_{component}.SAC
# Azimuth and back azimuth come from the SAC headers (az/baz, or evla/evlo
# and stla/stlo); set rotation.azimuth and rotation.back_azimuth only to
# override them.
