source_station: WT.2001
receiver_station: WT.2085
components: [ZZ, ZR, RZ, RR]

io:
  input_root_datadir: /path/to/CCF_ZRT
  output_root_datadir: /path/to/FTAN
  input_template: "*_{component}_pws.SAC"
  overwrite: false

aftan:
  debug: false
  # positive, negative, both, or stack.
  # If a two-sided option is requested for a one-sided trace, SeisForge logs a
  # warning and falls back to positive.
  branch: positive
  min_period: 0.5
  max_period: 10.0
  period_sampling:
    # Options:
    #   uniform: min_period:max_period with a fixed period step.
    #   geomspace: PyAFTAN-style logarithmic grid; use dfreq/min_count or count.
    #   list: explicit periods, useful for hand-picked test grids.
    mode: uniform
    step: 0.1
    # count: 60
    # mode: list
    # periods: [1.0, 1.2, 1.5, 2.0, 3.0, 5.0]
  # SeisForge short-distance guard, not an original AFTAN parameter.
  # Effective max period is min(max_period, distance_km /
  # (reference_velocity * max_period_nwl)). The default 0.5 is permissive:
  # it only requires the reference travel time to contain at least half a period.
  # Increase toward 1-2 for stricter short-path QC; decrease to relax.
  reference_velocity: 4.0
  max_period_nwl: 0.5
  # By default, SeisForge derives the Rayleigh-wave pi/4 phase correction from
  # component and branch. Negative branches are interpreted as reciprocal CCFs:
  # e.g. stored A_B ZR on the negative branch is measured as physical B_A RZ.
  # Output filenames follow the physical station pair/component when the config
  # provides source_station and receiver_station.
  pi_over_4:
    mode: auto
  velocity_window:
    min: 0.5
    max: 5.5
  # Optional two-column file: period(s), predicted phase velocity(km/s).
  # prediction_file: /path/to/predicted_phase_velocity.dat
  basic:
    # Basic FTAN Gaussian filter and jump correction.
    alpha:
      # Options:
      #   constant: fixed value.
      #   empirical_distance_table: interpolate SeisForge's distance-alpha table.
      #   aftan_distance_scaling: alpha = factor * 20 * sqrt(distance_km / 1000).
      #   pyftan_constant: PyAFTAN-style constant multiplied by factor.
      mode: constant
      value: 20.0
      # factor: 1.0
    trig_threshold: 50.0
    jump_points: 3
  pmf:
    enabled: false
    # PMF has its own Gaussian filter and jump correction, matching PyAFTAN's
    # bas/pmf separation. The alpha is used by the PMF spectral taper and the
    # second-pass FTAN on the PMF-clean waveform.
    alpha:
      mode: constant
      value: 20.0
    trig_threshold: 20.0
    jump_points: 3
    nalpha: 2.0
    min_half_length: 5.0
    amplitude_ratio: 0.2
    window_factor: 1.0
    # raw follows the exact first-pass apparent-period bounds.
    # step snaps the PMF second-pass range, e.g. 0.794-7.414 -> 0.7-7.5.
    period_bounds:
      mode: raw
      # mode: step
      # step: 0.1
      min_method: floor
      max_method: ceil
  energy_map:
    enabled: false
    plot: false
    # Number of samples in the plotted/output velocity axis between
    # velocity_window.min and velocity_window.max.
    velocity_count: 240
    normalize: true
    # Diagnostic map for phase-velocity cycle candidates.
    phase_velocity: false
    phase_cycle_count: 5
  qc:
    # Warning only. SeisForge logs if max(abs(instant_period-target_period)
    # / target_period) exceeds this value; output is not trimmed or rejected.
    period_rel_warning: 0.35
    # AFTAN-style retained-branch completeness check. The default 0 disables
    # this warning. Use 0.5 to warn when fewer than half of the attempted target
    # periods survive trigger/jump correction. Set fail_on_short_branch: true
    # only for strict automated rejection.
    min_valid_fraction: 0.0
    fail_on_short_branch: false
  snr:
    # definition options:
    #   local: signal window around t_pick = distance/group_velocity.
    #   pyftan: PyAFTAN/Bensen-style signal and tail-noise windows.
    #   aftan: FTAN-diagram peak/minimum contrast diagnostic.
    definition: local
    # false writes linear SNR; true writes dB.
    output_db: false
    # local only: tail uses a trailing noise window; complement uses everything
    # outside the picked signal window plus guard on the selected branch trace.
    noise_mode: tail
    # local only: signal window is [t_pick - factor*T, t_pick + factor*T].
    signal_half_width_factor: 1.0
    noise_guard_factor: 1.0
    # pyftan only: Bensen/PyAFTAN-style signal and tail-noise windows.
    bfact: 1.0
    efact: 0.0
    dsn: 500.0
    nlen: 500.0
    vmax: 4.5
    vmin: 1.0
