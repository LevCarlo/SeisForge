# Diffuse-field H/V of a layered model (seisforge.hvsr, native solver).
# Read by hvsr_forward.py; the package has no command for this yet.
model_file: data/model.txt          # change this: thickness_km vp_km_s vs_km_s density_g_cm3 per row
frequency_hz:                       # change this: frequencies to compute (log-spaced)
  min: 0.2
  max: 10.0
  count: 100
output_file: output/hvsr.dat
# Optional: which terms to compute (seisforge.hvsr.DiffuseFieldSettings), defaults:
# settings: {max_rayleigh_modes: 20, max_love_modes: 20, include_body_waves: true,
#            horizontal_definition: sum}
# Accuracy controls of the native solver (body-wave quadrature tolerance 1e-6,
# ...) are fields of NativeDiffuseFieldSolver; the script uses its defaults and
# records them in the output header.
