site_name: SeisForge
site_description: Python toolkit for ambient-noise, receiver-function, HVSR, and surface-wave inversion workflows
site_url: https://levcarlo.github.io/SeisForge/
repo_url: https://github.com/LevCarlo/SeisForge
repo_name: LevCarlo/SeisForge
edit_uri: edit/dev/docs/
site_dir: site
docs_dir: docs
dev_addr: 127.0.0.1:8000
strict: true
# LaTeX snippets written by docs/ant/scripts/*.py and included into pages.
exclude_docs: |
  ant/generated/
validation:
  links:
    not_found: warn
    anchors: warn

theme:
  # Built with Zensical (modern look); mkdocs-material 9.x builds the same
  # file with its own look.
  name: material
  font:
    text: Source Serif 4
    code: Source Code Pro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  - css/theme.css
  - css/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home:
      - Overview: index.md
      - Examples overview: examples.md
      - Conventions: conventions.md
      - References: references.md
      - Changelog: changelog.md
      - Development: development.md
  - Ambient noise:
      - Overview: ant/index.md
      - "Multi-component CCFs: ZNE → ZRT": ant/rotation.md
      - "AFTAN: FTAN and PMF": ant/dispersion.md
      - Eikonal and Helmholtz tomography: ant/tomography.md
  - Receiver functions:
      - Workflow: rf_workflow.md
  - HVSR:
      - Forward modelling: hvsr_forward.md
  - Inversion:
      - Overview: inv/index.md
      - Model space and prior: inv/model.md
      - Forward modelling and likelihood: inv/forward.md
      - Sampling: inv/sampler.md
      - Posterior and convergence: inv/posterior.md
  - API:
      - Overview: api/index.md
      - Ambient noise: api/ant.md
      - Receiver functions: api/rf.md
      - HVSR: api/hvsr.md
      - Inversion: api/inv.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            heading_level: 3
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            show_if_no_docstring: true

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
