site_name: SeisForge
site_description: Python toolkit for ambient-noise, receiver-function, HVSR, and surface-wave inversion workflows
site_url: https://levcarlo.github.io/SeisForge/
repo_url: https://github.com/LevCarlo/SeisForge
repo_name: LevCarlo/SeisForge
edit_uri: edit/dev/docs/
site_dir: site
docs_dir: docs
dev_addr: 127.0.0.1:8000
strict: true
validation:
  links:
    not_found: warn
    anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  - css/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Examples overview: examples.md
  - Conventions: conventions.md
  - Ambient noise:
      - Overview: ant/index.md
      - Rotation of multi-component CCFs: ant/rotation.md
      - "Rotation: executable derivation": ant/scripts/rotation_derivation.py
      - Dispersion measurement: ant/dispersion.md
      - Eikonal and Helmholtz tomography: ant/tomography.md
      - Previous pages (to be migrated):
          - CCF rotation and filters: ant_workflow.md
          - AFTAN dispersion: aftan_workflow.md
          - AFTAN phase constants (derivation and history): aftan_phase_constants.md
          - Eikonal / Helmholtz tomography: eikonal_workflow.md
  - Receiver functions: rf_workflow.md
  - Inversion:
      - Getting started: inv_getting_started.md
      - Model guide: model.md
      - Configuration reference: inv_usage.md
  - HVSR forward modelling: hvsr_forward.md
  - API reference:
      - Overview: api/index.md
      - Inversion: api/inv.md
      - Receiver functions: api/rf.md
      - Ambient noise: api/ant.md
      - HVSR: api/hvsr.md
  - References: references.md
  - Changelog: changelog.md
  - Development: development.md

plugins:
  - search
  # Executes the jupytext derivation scripts at build time and renders them as
  # pages. Only the files listed here are notebooks; the figure scripts next
  # to them are plain Python and are copied as files.
  - mkdocs-jupyter:
      include: ["ant/scripts/rotation_derivation.py"]
      execute: true
      allow_errors: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            heading_level: 3
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            show_if_no_docstring: true

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
