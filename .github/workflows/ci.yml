name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Test
        # The f2py HVSR extension and the HVDFA regression are skipped unless
        # built/configured; everything else runs.
        run: python -m pytest -q
      - name: Full example runs
        # The two inversion examples with their documented chain lengths
        # (a few minutes); the default suite runs them with short chains.
        if: matrix.python-version == '3.12'
        run: python -m pytest -q -m slow tests/test_examples.py
